<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Eta Support</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.65;
            }

            body {
                max-width: 760px;
                margin: 0 auto;
                padding: 48px 24px 72px;
                color: #1d1d1f;
                background: #ffffff;
            }

            h1 {
                margin-bottom: 8px;
                font-size: 40px;
                letter-spacing: -1px;
            }

            p {
                color: #424245;
            }

            .tagline {
                margin-bottom: 32px;
                font-size: 18px;
            }

            .card {
                margin-top: 16px;
                padding: 20px 24px;
                border: 1px solid #e5e5e7;
                border-radius: 16px;
                background: #f5f5f7;
            }

            .card h2 {
                margin-top: 0;
                font-size: 20px;
            }

            a {
                color: #06c;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    color: #f5f5f7;
                    background: #1d1d1f;
                }

                p {
                    color: #d2d2d7;
                }

                .card {
                    border-color: #424245;
                    background: #2c2c2e;
                }

                a {
                    color: #2997ff;
                }
            }
        </style>
    </head>
    <body>
        <h1>Eta Support</h1>
        <p class="tagline">
            Eta is a privacy-focused personal expense tracker for iOS.
        </p>

        <section class="card">
            <h2>Contact</h2>
            <p>For support, feedback, or feature requests:</p>
            <a href="mailto:datnq1210@gmail.com">datnq1210@gmail.com</a>
        </section>

        <section class="card">
            <h2>Privacy Policy</h2>
            <p>Learn how Eta handles your data and protects your privacy.</p>
            <a href="./privacy-policy.html">Read the Eta Privacy Policy</a>
        </section>
    </body>
</html>
