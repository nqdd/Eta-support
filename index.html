<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Eta Support</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.65;
            }

            body {
                max-width: 760px;
                margin: 0 auto;
                padding: 48px 24px 72px;
                color: #1d1d1f;
                background: #ffffff;
            }

            h1 {
                margin-bottom: 8px;
                font-size: 34px;
                letter-spacing: -0.8px;
            }

            h2 {
                margin-top: 32px;
                margin-bottom: 8px;
                font-size: 21px;
                letter-spacing: -0.2px;
            }

            p {
                margin: 10px 0;
                color: #424245;
            }

            a {
                color: #06c;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    color: #f5f5f7;
                    background: #1d1d1f;
                }

                p {
                    color: #d2d2d7;
                }

                a {
                    color: #2997ff;
                }
            }
        </style>
    </head>
    <body>
        <h1>Eta Support</h1>

        <p>Eta is a privacy-focused personal expense tracker for iOS.</p>

        <h2>Contact</h2>
        <p>For support, feedback, or feature requests, contact:</p>
        <p><a href="mailto:datnq1210@gmail.com">datnq1210@gmail.com</a></p>

        <h2>Privacy Policy</h2>
        <p>Read the <a href="./privacy-policy">Eta Privacy Policy</a>.</p>

</html>
